[project]
name = "circuit-discovery"
version = "0.1.0"
description = "Research code for discovering and causally evaluating computational pathways in language models"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
graph = [
  "circuit-tracer @ git+https://github.com/decoderesearch/circuit-tracer.git@255d989e93be1299d53d67b59e9fd76a0e274b14",
  "torch==2.8.0",
  "transformers==4.57.3",
  "transformer-lens==2.16.1",
  "nnsight==0.8.1",
  "huggingface-hub==0.36.0",
  "numpy==1.26.4",
  # Newer PyArrow wheels require NumPy 2, conflicting with this tracer stack.
  "pyarrow==21.0.0",
  "datasets==3.6.0",
  "safetensors==0.6.2",
  "accelerate==1.11.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["code/example_code/tests", "code/workflow/tests"]
pythonpath = ["code/example_code"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
